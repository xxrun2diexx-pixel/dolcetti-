<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#c6f1de">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Dolcetti</title>
<style>
:root{
  --ink:#3b1e2b;--mint:#c6f1de;--pink:#ffb3cb;--pink2:#ff7aa5;--blush:#fff3f7;
  --c0:#ff5c8a;--c1:#ffcf33;--c2:#2fd6a0;--c3:#4a86ff;--c4:#a35cf0;--c5:#ff8a3d;
  --ol:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 3px 0 var(--ink);
  --bs:min(calc(94vw - 26px),calc(100vh - 340px),560px);
  font-family:"Nunito","Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@supports(height:100dvh){:root{--bs:min(calc(94vw - 26px),calc(100dvh - 340px),560px)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;color:var(--ink)}
body{
  background-color:var(--mint);
  background-image:
    radial-gradient(circle at 12% 18%,color-mix(in srgb,var(--c0) 60%,transparent) 0 5px,transparent 6px),
    radial-gradient(circle at 78% 12%,color-mix(in srgb,var(--c1) 70%,transparent) 0 6px,transparent 7px),
    radial-gradient(circle at 40% 70%,color-mix(in srgb,var(--c3) 55%,transparent) 0 5px,transparent 6px),
    radial-gradient(circle at 88% 62%,color-mix(in srgb,var(--c4) 55%,transparent) 0 6px,transparent 7px),
    radial-gradient(circle at 22% 92%,color-mix(in srgb,var(--c5) 65%,transparent) 0 5px,transparent 6px),
    radial-gradient(circle at 60% 38%,color-mix(in srgb,var(--c2) 70%,transparent) 0 4px,transparent 5px);
  background-size:260px 260px;
}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.screen.on{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* buttons */
.btn{appearance:none;border:3px solid var(--ink);background:#fff;font-weight:900;font-size:21px;padding:14px 26px;border-radius:22px;box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s;cursor:pointer}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--pink2)}
.btn:focus-visible,.ib:focus-visible,.lv:focus-visible{outline:4px dashed var(--c3);outline-offset:3px}
.ib{appearance:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .08s,box-shadow .08s}
.ib:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.ib svg{width:26px;height:26px}

/* menu */
.stack{margin:auto;display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
.logo{margin:0;display:flex;font-size:clamp(52px,17.5vw,98px);line-height:1;font-weight:900}
.logo span{display:inline-block;color:var(--lc);--o:.045em;
  text-shadow:calc(var(--o)*-1) calc(var(--o)*-1) 0 var(--ink),var(--o) calc(var(--o)*-1) 0 var(--ink),calc(var(--o)*-1) var(--o) 0 var(--ink),var(--o) var(--o) 0 var(--ink),0 calc(var(--o)*-1) 0 var(--ink),0 var(--o) 0 var(--ink),calc(var(--o)*-1) 0 0 var(--ink),var(--o) 0 0 var(--ink),0 .1em 0 var(--ink),.02em .12em 0 rgba(59,30,43,.25);
  animation:hop .7s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes hop{from{transform:translateY(-140%) rotate(-12deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.tag{margin:0;font-size:19px;font-weight:800}
.showcase{display:flex;gap:2px}
.showcase i{width:min(14vw,62px);height:min(14vw,62px);display:block;transform:rotate(var(--rot))}
.showcase svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(59,30,43,.3))}
.main{display:flex;flex-direction:column;gap:16px;width:min(80vw,320px)}
.row{display:flex;gap:16px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;width:min(94vw,560px);margin-bottom:6px}
.top h2{margin:0;font-size:28px;font-weight:900}
.top .sp{width:52px}

/* levels */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:min(94vw,460px);overflow:auto;padding:8px 8px 28px;margin-top:6px}
.lv{appearance:none;aspect-ratio:1;border:3px solid var(--ink);border-radius:24px;background:var(--c);box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;cursor:pointer;transition:transform .08s,box-shadow .08s}
.lv:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.lv b{font-size:38px;font-weight:900;color:#fff;text-shadow:var(--ol);line-height:1}
.lv .mini{display:flex}
.lv .mini svg{width:22px;height:22px}
.lv.lock{background:#e4d8de;box-shadow:0 6px 0 #9c8793;border-color:#9c8793;color:#9c8793}
.lv .lk svg{width:34px;height:34px}

/* game hud */
.stats{display:flex;gap:10px;width:min(94vw,560px)}
.stat{flex:1;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:4px 8px;text-align:center;line-height:1.1}
.stat small{display:block;font-size:13px;font-weight:800;opacity:.75}
.stat b{font-size:30px;font-weight:900;display:inline-block}
.stat.low b{color:#e0274f;animation:throb .6s infinite alternate}
@keyframes throb{to{transform:scale(1.18)}}
.goals{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(94vw,560px);margin-top:10px;min-height:44px}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:3px 12px 3px 6px;font-weight:900;font-size:19px}
.chip i{display:block;width:30px;height:30px}
.chip svg{width:100%;height:100%}
.chip.done{background:#b9f3d6}

/* board */
#frame{margin:auto 0;padding:10px;border:3px solid var(--ink);border-radius:28px;background:linear-gradient(160deg,var(--pink),var(--pink2));box-shadow:0 8px 0 var(--ink);position:relative}
#board{position:relative;width:var(--bs);height:var(--bs);border-radius:18px;overflow:hidden;touch-action:none;background:var(--blush)}
.layer{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);pointer-events:none}
.layer .a{background:#fff3f7}
.layer .b{background:#ffe0ea}
#tiles{position:absolute;inset:0;overflow:hidden}
#iceLayer{z-index:2}
.ice.i1{border:2px solid rgba(255,255,255,.95);background:linear-gradient(135deg,rgba(150,210,255,.5),rgba(190,235,255,.28));box-shadow:inset 0 0 10px rgba(255,255,255,.8)}
.ice.i2{border:3px solid #fff;background:linear-gradient(135deg,rgba(90,170,240,.75),rgba(150,210,255,.5));box-shadow:inset 0 0 0 4px rgba(255,255,255,.5),inset 0 0 14px #fff}
.tile{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .32s cubic-bezier(.3,1.25,.5,1);will-change:transform}
.tile .in{width:100%;height:100%;padding:7%}
.tile svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 2px 0 rgba(59,30,43,.28))}
.tile.sp .in{animation:glow 1.1s ease-in-out infinite alternate}
.tile.sel .in{animation:sel .45s ease-in-out infinite alternate}
.tile.hint .in{animation:wiggle 1s infinite}
.tile.pop .in{animation:pop .3s ease-in forwards}
.tile.born .in{animation:born .45s cubic-bezier(.3,1.6,.5,1)}
.tile.wob .in{animation:wob .4s}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes sel{from{transform:scale(1.06)}to{transform:scale(1.2)}}
@keyframes wiggle{0%,55%,100%{transform:none}10%{transform:rotate(-12deg) scale(1.1)}20%{transform:rotate(12deg) scale(1.1)}30%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.25)}100%{transform:scale(0);opacity:0}}
@keyframes born{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes wob{25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:3}
#fx i{position:absolute;border-radius:50%}
.ptxt{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(17px,5vw,26px);color:#fff;text-shadow:var(--ol);animation:floatUp .9s ease-out forwards;white-space:nowrap}
@keyframes floatUp{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-46px}}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(0);font-weight:900;font-size:clamp(30px,9vw,50px);color:#fff;text-shadow:var(--ol);pointer-events:none;white-space:nowrap;z-index:4}
#banner.go{animation:banner 1s forwards}
@keyframes banner{0%{transform:translate(-50%,-50%) scale(.3) rotate(-6deg);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-62%) scale(1);opacity:0}}

/* modal */
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(59,30,43,.55);padding:20px;z-index:10}
#modal.on{display:flex;animation:fadeIn .2s}
.card{background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:22px 20px;width:min(92vw,400px);max-height:92vh;overflow:auto;text-align:center;animation:cardIn .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes cardIn{from{transform:scale(.8) translateY(20px);opacity:0}}
.card h2{margin:0 0 10px;font-size:30px;line-height:1.1;font-weight:900}
.card p{margin:6px 0;font-size:17px;font-weight:700;line-height:1.35}
.card .btns{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.card .btn{font-size:19px;padding:12px 20px}
.grow{display:flex;align-items:center;gap:12px;text-align:left;font-weight:800;font-size:18px;padding:6px 4px;line-height:1.25}
.grow i{display:block;width:40px;height:40px;flex:none}
.grow svg{width:100%;height:100%}
.stars{display:flex;justify-content:center;gap:6px;margin:8px 0 10px}
.stars svg{width:70px;height:70px;display:block}
.st.earn{animation:starIn .5s cubic-bezier(.3,1.8,.5,1) both}
@keyframes starIn{from{transform:scale(0) rotate(-60deg)}to{transform:none}}


/* account / login */
input{-webkit-user-select:text;user-select:text}
.field{appearance:none;width:100%;border:3px solid var(--ink);border-radius:18px;background:#fff;font:inherit;font-weight:800;font-size:20px;padding:12px 16px;color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.field:focus{outline:4px dashed var(--c3);outline-offset:3px}
.field::placeholder{color:#b9a3ad}
#login{overflow:auto}
#login .stack{max-width:340px}
.form{display:flex;flex-direction:column;gap:14px;width:min(86vw,340px)}
.msg{min-height:22px;margin:0;font-weight:800;font-size:16px;text-align:center;color:#e0274f}
.msg.ok{color:#0f8a63}
.btn.small{font-size:16px;padding:8px 16px;border-radius:16px;box-shadow:0 4px 0 var(--ink)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;text-decoration:underline;font-size:17px;padding:6px 10px}
.acc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:17px}
.cloud{margin:0;font-size:14px;font-weight:800;opacity:.7;min-height:18px}
.boot{margin:auto;font-weight:900;font-size:26px}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important}
}
</style>
</head>
<body>
<main id="app">
  <section id="boot" class="screen on"><p class="boot">Dolcetti&hellip;</p></section>

  <section id="login" class="screen">
    <div class="stack">
      <h1 class="logo" id="logo2" aria-label="Dolcetti"></h1>
      <p class="tag">Entra per salvare i tuoi progressi</p>
      <div class="form">
        <input class="field" id="lgName" type="text" placeholder="Nome" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="16">
        <input class="field" id="lgPass" type="password" placeholder="Password" autocomplete="current-password" maxlength="64">
        <p class="msg" id="lgMsg" role="alert"></p>
        <button class="btn primary" id="lgIn">Entra</button>
        <button class="btn" id="lgReg">Crea account</button>
        <button class="btn ghost" id="lgGuest">Gioca senza account</button>
      </div>
    </div>
  </section>

  <section id="menu" class="screen">
    <div class="stack">
      <h1 class="logo" id="logo" aria-label="Dolcetti"></h1>
      <p class="tag">Abbina tre dolcetti o più</p>
      <div class="showcase" id="showcase" aria-hidden="true"></div>
      <div class="main">
        <button class="btn primary" data-act="play" id="playLbl">Gioca</button>
        <button class="btn" data-act="levels">Livelli</button>
        <button class="btn" data-act="help">Come si gioca</button>
      </div>
      <div class="row">
        <button class="ib" data-act="tsnd" data-t="snd" aria-label="Suoni"></button>
        <button class="ib" data-act="tmus" data-t="mus" aria-label="Musica"></button>
      </div>
      <div class="acc"><span id="accName"></span><button class="btn small" id="accBtn">Accedi</button></div>
      <p class="cloud" id="cloudSt"></p>
    </div>
  </section>

  <section id="levels" class="screen">
    <div class="top">
      <button class="ib" data-act="menu" data-icon="back" aria-label="Indietro"></button>
      <h2>Livelli</h2>
      <span class="sp"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="game" class="screen">
    <div class="top">
      <button class="ib" data-act="pause" data-icon="pause" aria-label="Pausa"></button>
      <h2 id="lvTitle">Livello 1</h2>
      <span class="sp"></span>
    </div>
    <div class="stats">
      <div class="stat" id="mvBox"><small>Mosse</small><b id="mv">0</b></div>
      <div class="stat"><small>Punti</small><b id="sc">0</b></div>
    </div>
    <div class="goals" id="goals"></div>
    <div id="frame">
      <div id="board">
        <div class="layer" id="bgLayer"></div>
        <div id="tiles"></div>
        <div class="layer" id="iceLayer"></div>
        <div id="fx"></div>
        <div id="banner"></div>
      </div>
    </div>
  </section>
</main>
<div id="modal" role="dialog" aria-modal="true"></div>

<script>
(() => {
'use strict';

/* ---------- costanti e utilità ---------- */
const N = 8;
const COL   = ['#ff5c8a','#ffcf33','#2fd6a0','#4a86ff','#a35cf0','#ff8a3d'];
const DARK  = ['#b92a58','#b88a00','#0f8a63','#2150bd','#6428b0','#b8540f'];
const LIGHT = ['#ffb4cb','#fff19a','#97f3d3','#aecbff','#d9b0ff','#ffc79b'];
const CW    = ['rosa','gialli','verdi','blu','viola','arancioni'];
const INK = '#3b1e2b';
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = n => Math.floor(Math.random() * n);
const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const inB = (r, c) => r >= 0 && r < N && c >= 0 && c < N;

const poly = (cx, cy, ro, ri, n, rot) => {
  const k = ri ? n * 2 : n, p = [];
  for (let i = 0; i < k; i++) {
    const r = ri ? (i % 2 ? ri : ro) : ro, a = (rot + i * 360 / k) * Math.PI / 180;
    p.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1));
  }
  return p.join(' ');
};

/* ---------- salvataggio ---------- */
const GUEST_KEY = 'dolcetti_v2';
let storeKey = GUEST_KEY;
const blankSave = () => ({ stars: [], sfx: true, music: true });
const readLocal = key => { try { const s = JSON.parse(localStorage.getItem(key)); return s && typeof s === 'object' ? s : null; } catch (e) { return null; } };
let save = Object.assign(blankSave(), readLocal(GUEST_KEY) || {});
const persist = () => {
  try { localStorage.setItem(storeKey, JSON.stringify(save)); } catch (e) {}
  if (typeof window.onDolcettiSave === 'function') window.onDolcettiSave(save);
};

/* ---------- grafica dei dolcetti (SVG) ---------- */
let defs = '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>';
for (let t = 0; t < 6; t++) {
  defs += `<radialGradient id="g${t}" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="${LIGHT[t]}"/><stop offset=".45" stop-color="${COL[t]}"/><stop offset="1" stop-color="${DARK[t]}"/></radialGradient>`;
}
defs += '<radialGradient id="gb" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#8a5260"/><stop offset=".5" stop-color="#4a2432"/><stop offset="1" stop-color="#220d17"/></radialGradient></defs></svg>';
document.body.insertAdjacentHTML('afterbegin', defs);

function shape(t) {
  const f = `fill="url(#g${t})" stroke="${DARK[t]}" stroke-width="5" stroke-linejoin="round"`;
  switch (t) {
    case 0: return `<circle cx="50" cy="52" r="36" ${f}/>`;
    case 1: return `<rect x="15" y="16" width="70" height="70" rx="23" ${f}/>`;
    case 2: return `<polygon points="50,10 88,50 50,90 12,50" ${f}/>`;
    case 3: return `<path d="M50 10C58 28 80 44 80 63C80 80 66 91 50 91C34 91 20 80 20 63C20 44 42 28 50 10Z" ${f}/>`;
    case 4: return `<polygon points="${poly(50, 54, 43, 19, 5, -90)}" ${f}/>`;
    default: return `<polygon points="${poly(50, 50, 40, 0, 6, -90)}" ${f}/>`;
  }
}
const HL = '<ellipse cx="37" cy="35" rx="12" ry="7" fill="#fff" opacity=".6" transform="rotate(-30 37 35)"/>';
const SPR = [[30,34,-30,0],[62,26,20,1],[74,52,70,2],[66,76,-20,3],[36,78,40,4],[24,56,-60,5],[50,22,0,2],[50,60,30,0]];
const BOMB = '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="52" r="38" fill="url(#gb)" stroke="#1f0d16" stroke-width="5"/>' +
  SPR.map(([x, y, a, i]) => `<rect x="${x - 6}" y="${y - 2.5}" width="12" height="5" rx="2.5" fill="${COL[i]}" transform="rotate(${a} ${x} ${y})"/>`).join('') +
  HL + '</svg>';

function candy(t, s) {
  if (s === 4) return BOMB;
  let o = '';
  if (s === 3) {
    o += `<path d="M3 50L19 33V67Z" fill="${LIGHT[t]}" stroke="${DARK[t]}" stroke-width="4" stroke-linejoin="round"/>`;
    o += `<path d="M97 50L81 33V67Z" fill="${LIGHT[t]}" stroke="${DARK[t]}" stroke-width="4" stroke-linejoin="round"/>`;
  }
  o += shape(t) + HL;
  if (s === 3) o += '<circle cx="50" cy="52" r="46" fill="none" stroke="#fff" stroke-width="3.5" stroke-dasharray="5 6" opacity=".95"/>';
  if (s === 1 || s === 2) {
    const a = `<path d="M20 50L35 36V44H65V36L80 50L65 64V56H35V64Z" fill="#fff" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
    o += s === 1 ? a : `<g transform="rotate(90 50 50)">${a}</g>`;
  }
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${o}</svg>`;
}
const starSVG = on => `<svg viewBox="0 0 24 24"><polygon points="${poly(12, 13, 10.5, 4.6, 5, -90)}" fill="${on ? '#ffcf33' : '#e6d5dc'}" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;

const IC = {
  back: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.5" fill="currentColor"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.5" fill="currentColor"/></svg>',
  snd: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  sndOff: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  mus: '<svg viewBox="0 0 24 24"><path d="M9 17.5V5.5l11-2v12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="3" fill="currentColor"/><circle cx="17.5" cy="15.5" r="3" fill="currentColor"/></svg>',

/* ---------- ricerca combinazioni ---------- */
function findRuns() {
  const H = [], V = [];
  for (let r = 0; r < N; r++) {
    let c = 0;
    while (c < N) {
      const t = T(r, c);
      if (t < 0) { c++; continue; }
      let e = c;
      while (e + 1 < N && T(r, e + 1) === t) e++;
      if (e - c >= 2) { const cells = []; for (let x = c; x <= e; x++) cells.push([r, x]); H.push(cells); }
      c = e + 1;
    }
  }
  for (let c = 0; c < N; c++) {
    let r = 0;
    while (r < N) {
      const t = T(r, c);
      if (t < 0) { r++; continue; }
      let e = r;
      while (e + 1 < N && T(e + 1, c) === t) e++;
      if (e - r >= 2) { const cells = []; for (let y = r; y <= e; y++) cells.push([y, c]); V.push(cells); }
      r = e + 1;
    }
  }
  return { H, V };
}

function analyze(hint) {
  const { H, V } = findRuns();
  if (!H.length && !V.length) return null;
  const key = (r, c) => r * N + c;
  const clear = new Set(), creates = new Map(), hset = new Set(), vset = new Set();
  H.forEach(run => run.forEach(([r, c]) => { hset.add(key(r, c)); clear.add(key(r, c)); }));
  V.forEach(run => run.forEach(([r, c]) => { vset.add(key(r, c)); clear.add(key(r, c)); }));
  const pick = run => {
    const cand = run.filter(([r, c]) => board[r][c].s === 0);
    if (!cand.length) return null;
    const h = hint && cand.find(([r, c]) => hint.some(p => p[0] === r && p[1] === c));
    return h || cand[cand.length >> 1];
  };
  const setC = (p, s, prio) => {
    if (!p) return;
    const k = key(p[0], p[1]), cur = creates.get(k);
    if (!cur || cur.prio < prio) creates.set(k, { s, prio });
  };
  H.forEach(run => { if (run.length === 4) setC(pick(run), 2, 1); else if (run.length >= 5) setC(pick(run), 4, 4); });
  V.forEach(run => { if (run.length === 4) setC(pick(run), 1, 1); else if (run.length >= 5) setC(pick(run), 4, 4); });
  hset.forEach(k => {
    if (vset.has(k)) { const r = (k / N) | 0, c = k % N; if (board[r][c].s === 0) setC([r, c], 3, 3); }
  });
  creates.forEach((v, k) => clear.delete(k));
  return { clear, creates };
}

function valid(r1, c1, r2, c2) {
  const a = board[r1][c1], b = board[r2][c2];
  if (!a || !b) return false;
  if (a.s === 4 || b.s === 4) return true;
  if (a.s && b.s) return true;
  board[r1][c1] = b; board[r2][c2] = a;
  const { H, V } = findRuns();
  board[r1][c1] = a; board[r2][c2] = b;
  return H.length > 0 || V.length > 0;
}
function getHint() {
  const list = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (c < N - 1 && valid(r, c, r, c + 1)) list.push([r, c, r, c + 1]);
    if (r < N - 1 && valid(r, c, r + 1, c)) list.push([r, c, r + 1, c]);
  }
  return list.length ? list[rand(list.length)] : null;
}

/* ---------- effetti dei dolcetti speciali ---------- */
function expand(clear, act) {
  const q = [...clear];
  const add = (r, c) => { if (!inB(r, c)) return; const k = r * N + c; if (!clear.has(k)) { clear.add(k); q.push(k); } };
  while (q.length) {
    const k = q.pop(), r = (k / N) | 0, c = k % N, tile = board[r][c];
    if (!tile || !tile.s || act.has(tile.id)) continue;
    act.add(tile.id);
    if (tile.s === 1) { for (let x = 0; x < N; x++) add(r, x); }
    else if (tile.s === 2) { for (let y = 0; y < N; y++) add(y, c); }
    else if (tile.s === 3) { for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) add(r + dr, c + dc); }
    else if (tile.s === 4) {
      const present = [];
      forEachTile(t => { if (t.t >= 0 && present.indexOf(t.t) < 0) present.push(t.t); });
      if (present.length) { const tp = present[rand(present.length)]; forEachTile(t => { if (t.t === tp) add(t.r, t.c); }); }
    }
  }
}

function comboFor(p, q) {
  if (!p.s && !q.s) return null;
  const clear = new Set();
  const add = (r, c) => { if (inB(r, c)) clear.add(r * N + c); };
  if (p.s === 4 || q.s === 4) {
    const bomb = p.s === 4 ? p : q, o = bomb === p ? q : p;
    add(bomb.r, bomb.c);
    if (o.s === 4) { for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) add(r, c); }
    else if (o.s === 0) { forEachTile(t => { if (t.t === o.t) add(t.r, t.c); }); }
    else {
      forEachTile(t => { if (t.t === o.t && t.s === 0) { t.s = o.s === 3 ? 3 : 1 + rand(2); refresh(t); } });
      forEachTile(t => { if (t.t === o.t) add(t.r, t.c); });
    }
    return { clear, bonus: 200 };
  }
  if (!(p.s && q.s)) return null;
  const R = q.r, C = q.c;
  if (p.s !== 3 && q.s !== 3) { for (let i = 0; i < N; i++) { add(R, i); add(i, C); } }
  else if (p.s === 3 && q.s === 3) { for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) add(R + dr, C + dc); }
  else { for (let i = 0; i < N; i++) for (let d = -1; d <= 1; d++) { add(R + d, i); add(i, C + d); } }
  add(p.r, p.c); add(q.r, q.c);
  return { clear, bonus: 150 };
}

/* ---------- cuore del gioco ---------- */
async function applyClear(clear, creates, combo, extra = 0) {
  const act = new Set();
  expand(clear, act);
  creates.forEach((v, k) => { if (clear.has(k)) creates.delete(k); });
  let n = 0, sr = 0, sc = 0, cracked = false;
  const big = clear.size > 14;
  clear.forEach(k => {

    setTimeout(() => tl.el.remove(), 340);

  });
  creates.forEach((v, k) => {
    const r = (k / N) | 0, c = k % N, tl = board[r][c];

async function gravity() {
  const spawned = [];
  for (let c = 0; c < N; c++) {
    let w = N - 1;
    for (let r = N - 1; r >= 0; r--) {
      const t = board[r][c];
      if (t) {
        if (w !== r) { board[w][c] = t; board[r][c] = null; put(t, w, c); }
        w--;
      }
    }
    const cnt = w + 1;
    for (let r = w; r >= 0; r--) {
      const t = mk(rand(LV.colors), 0);
      board[r][c] = t; put(t, r - cnt, c);
      spawned.push([t, r, c]);
    }
  }
  void tilesEl.offsetWidth;
  spawned.forEach(([t, r, c]) => put(t, r, c));
  await wait(340);
}

async function cascade(hint) {
  let combo = 0;
  while (true) {
    const a = analyze(hint); hint = null;
    if (!a) break;
    combo++;
    await applyClear(a.clear, a.creates, combo);
    await gravity();
  }
}

async function shuffle() {
  banner('Rimescolo!'); sfx.shuffle();
  let tries = 0;
  do {
    forEachTile(t => { if (t.s !== 4) { t.t = rand(LV.colors); refresh(t); } });
    tries++;
  } while ((analyze(null) || !getHint()) && tries < 80);
  forEachTile(t => t.el.classList.add('wob'));
  await wait(450);
  forEachTile(t => t.el.classList.remove('wob'));
}

async function settle() {
  if (goalsMet()) return finish(true);
  if (moves <= 0) return finish(false);
  if (!getHint()) await shuffle();
  busy = false; resetHint();
}

async function finish(win) {
  over = true; busy = false; clearTimeout(hintTimer);
  if (win) {
    const ratio = moves / LV.moves, stars = ratio >= .35 ? 3 : ratio >= .15 ? 2 : 1;
    save.stars[lvIdx] = Math.max(save.stars[lvIdx] || 0, stars); persist();
    sfx.win(); celebrate();
    await wait(1000);
    openWin(stars);
  } else {
    sfx.lose();
    await wait(500);
    openLose();
  }
}

async function attempt(r1, c1, r2, c2) {
  if (busy || over || !inB(r2, c2) || !board[r1][c1] || !board[r2][c2]) return;
  busy = true; deselect(); resetHint(true);
  try {
    swapT(r1, c1, r2, c2); sfx.swap();
    await wait(200);
    const combo = comboFor(board[r1][c1], board[r2][c2]);
    if (combo) {
      moves--; hud();
      await applyClear(combo.clear, new Map(), 1, combo.bonus);
      await gravity();
      await cascade(null);
    } else if (analyze([[r1, c1], [r2, c2]])) {
      moves--; hud();
      await cascade([[r1, c1], [r2, c2]]);
    } else {
      swapT(r1, c1, r2, c2); sfx.bad();
      await wait(200);
      busy = false; resetHint();
      return;
    }
    await settle();
  } catch (e) { if (!(e instanceof Cancel)) throw e; }
}

/* ---------- selezione, suggerimenti, input ---------- */
function deselect() {
  if (sel && board[sel.r] && board[sel.r][sel.c]) board[sel.r][sel.c].el.classList.remove('sel');
  sel = null;
}
function resetHint(onlyClear) {
  clearTimeout(hintTimer);
  forEachTile(t => t.el.classList.remove('hint'));
  if (!onlyClear && !over && !busy) hintTimer = setTimeout(showHint, 6000);
}
function showHint() {
  if (over || busy) return;
  const h = getHint();
  if (h) { board[h[0]][h[1]].el.classList.add('hint'); board[h[2]][h[3]].el.classList.add('hint'); }
}
function tapCell(r, c) {
  if (!sel) { sel = { r, c }; board[r][c].el.classList.add('sel'); sfx.sel(); return; }
  if (sel.r === r && sel.c === c) { deselect(); return; }
  if (Math.abs(sel.r - r) + Math.abs(sel.c - c) === 1) { const s = sel; attempt(s.r, s.c, r, c); return; }
  deselect(); sel = { r, c }; board[r][c].el.classList.add('sel'); sfx.sel();
}
let drag = null;
function cellAt(e) {
  const rect = boardEl.getBoundingClientRect();
  const c = Math.floor((e.clientX - rect.left) / rect.width * N), r = Math.floor((e.clientY - rect.top) / rect.height * N);
  return inB(r, c) ? { r, c } : null;
}
boardEl.addEventListener('pointerdown', e => {
  if (busy || over) return;
  const p = cellAt(e); if (!p || !board[p.r][p.c]) return;
  drag = { r: p.r, c: p.c, x: e.clientX, y: e.clientY, done: false };
  resetHint(true);
});
boardEl.addEventListener('pointermove', e => {
  if (!drag || drag.done || busy || over) return;
  const cs = boardEl.getBoundingClientRect().width / N, dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > cs * .4) {
    drag.done = true;
    let r = drag.r, c = drag.c;
    if (Math.abs(dx) > Math.abs(dy)) c += dx > 0 ? 1 : -1; else r += dy > 0 ? 1 : -1;
    const d = drag;
    if (inB(r, c)) attempt(d.r, d.c, r, c);
  }
});
boardEl.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.done || busy || over) return;
  tapCell(d.r, d.c); resetHint();
});
boardEl.addEventListener('pointercancel', () => { drag = null; });

/* ---------- avvio livello ---------- */
function fill() {
  let ok = false, tries = 0;
  while (!ok && tries++ < 40) {
    tilesEl.innerHTML = '';
    board = Array.from({ length: N }, () => Array(N).fill(null));
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      let t;
      do { t = rand(LV.colors); } while ((c >= 2 && T(r, c - 1) === t && T(r, c - 2) === t) || (r >= 2 && T(r - 1, c) === t && T(r - 2, c) === t));
      const tl = mk(t, 0); board[r][c] = tl; put(tl, r - N - 1, c);
    }
    ok = !!getHint();
  }
  void tilesEl.offsetWidth;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const tl = board[r][c];
    tl.el.style.transitionDelay = ((N - 1 - r) * 30 + c * 18) + 'ms';
    put(tl, r, c);
  }
  setTimeout(() => forEachTile(t => { t.el.style.transitionDelay = ''; }), 1000);
}
async function beginLevel() {
  try {
    busy = true; over = false;
    fill();
    await wait(950);
    busy = false; resetHint();
  } catch (e) { if (!(e instanceof Cancel)) throw e; }
}
function openLevel(i, direct) {
  gen++;
  clearTimeout(hintTimer);
  lvIdx = i; LV = LEVELS[i];
  busy = true; over = true; sel = null; drag = null;
  moves = LV.moves; score = 0; collected = [0, 0, 0, 0, 0, 0]; iceLeft = 0;
  tilesEl.innerHTML = ''; fxEl.innerHTML = '';
  board = Array.from({ length: N }, () => Array(N).fill(null));
  iceG = Array.from({ length: N }, (_, r) => Array.from({ length: N }, (_, c) => { const v = LV.ice ? LV.ice(r, c) : 0; if (v > 0) iceLeft++; return v; }));
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) renderIceCell(r, c);
  buildChips(); hud();
  $('#lvTitle').textContent = 'Livello ' + (i + 1);
  show('game');
  if (direct) { closeModal(); beginLevel(); return; }
  modal(`<h2>Livello ${i + 1}</h2>${LV.goals.map(g => `<div class="grow"><i>${goalIcon(g)}</i><span>${goalText(g)}</span></div>`).join('')}<p>Hai ${LV.moves} mosse.</p><div class="btns"><button class="btn primary" data-act="begin">Via!</button><button class="btn" data-act="levels">Indietro</button></div>`);
}

/* ---------- schermate e finestre ---------- */
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function modal(html) { modalEl.innerHTML = `<div class="card">${html}</div>`; modalEl.classList.add('on'); syncToggles(); }
function closeModal() { modalEl.classList.remove('on'); modalEl.innerHTML = ''; }
const unlocked = i => i === 0 || (save.stars[i - 1] > 0);
function nextLv() { for (let i = 0; i < LEVELS.length; i++) if (!(save.stars[i] > 0)) return i; return LEVELS.length - 1; }
function refreshMenu() { $('#playLbl').textContent = save.stars.some(s => s > 0) ? `Gioca il livello ${nextLv() + 1}` : 'Gioca'; }
function showLevels() {
  const g = $('#grid'); g.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const ok = unlocked(i), st = save.stars[i] || 0, d = document.createElement('button');
    d.className = 'lv' + (ok ? '' : ' lock'); d.dataset.act = 'lv'; d.dataset.i = i;
    d.style.setProperty('--c', `var(--c${i % 6})`);
    d.setAttribute('aria-label', `Livello ${i + 1}` + (ok ? '' : ', bloccato'));
    d.innerHTML = ok ? `<b>${i + 1}</b><span class="mini">${[0, 1, 2].map(k => starSVG(k < st)).join('')}</span>` : `<i class="lk">${IC.lock}</i>`;
    g.appendChild(d);
  });
  show('levels');
}
function openWin(stars) {
  const hasNext = lvIdx + 1 < LEVELS.length;
  const st = [0, 1, 2].map(i => `<span class="st ${i < stars ? 'earn' : ''}" style="animation-delay:${(.35 + i * .35).toFixed(2)}s">${starSVG(i < stars)}</span>`).join('');
  modal(`<h2>Che bontà!</h2><div class="stars">${st}</div><p>Punteggio: <b>${score}</b></p><p>Mosse avanzate: ${moves}</p><div class="btns">${hasNext ? '<button class="btn primary" data-act="next">Livello successivo</button>' : '<p>Hai completato tutti i livelli!</p>'}<button class="btn" data-act="retry">Rigioca</button><button class="btn" data-act="levels">Livelli</button></div>`);
  for (let i = 0; i < stars; i++) setTimeout(() => sfx.star(i), (.35 + i * .35) * 1000 + 100);
}
function openLose() {
  const left = LV.goals.filter(g => goalLeft(g) > 0).map(g =>
    g.k === 'score' ? `Ti mancano ${goalLeft(g)} punti` :
    g.k === 'collect' ? `Ti mancano ${goalLeft(g)} dolcetti ${CW[g.t]}` :
    `Ci sono ancora ${iceLeft} caselle di ghiaccio`);
  modal(`<h2>Mosse finite</h2>${left.map(t => `<p>${t}</p>`).join('')}<div class="btns"><button class="btn primary" data-act="retry">Riprova</button><button class="btn" data-act="levels">Livelli</button></div>`);
}
function openPause() {
  clearTimeout(hintTimer);
  modal('<h2>In pausa</h2><div class="btns"><button class="btn primary" data-act="resume">Riprendi</button><button class="btn" data-act="retry">Ricomincia</button><button class="btn" data-t="snd" data-act="tsnd"></button><button class="btn" data-t="mus" data-act="tmus"></button><button class="btn" data-act="levels">Livelli</button></div>');
}
function openHelp() {
  const row = (ic, tx) => `<div class="grow"><i>${ic}</i><span>${tx}</span></div>`;
  modal('<h2>Come si gioca</h2>' +
    '<p>Scambia due dolcetti vicini: trascina uno verso l\'altro, oppure toccali uno dopo l\'altro.</p>' +
    row(candy(0, 0), 'Allinea 3 o più dolcetti uguali per farli sparire.') +
    row(candy(1, 1), 'Con 4 in fila nasce un dolcetto a strisce: cancella una riga o una colonna.') +
    row(candy(2, 3), 'Con una forma a L o a T nasce un dolcetto incartato: esplode in un quadrato 3x3.') +
    row(BOMB, 'Con 5 in fila nasce il cioccolatino: scambialo con un dolcetto per cancellare tutti quelli dello stesso colore.') +
    row(IC.ice, 'Fai sparire i dolcetti sopra il ghiaccio per romperlo.') +
    '<p>Unisci due dolcetti speciali per effetti ancora più grandi.</p>' +
    '<div class="btns"><button class="btn primary" data-act="close">Ho capito</button></div>');
}

/* ---------- suoni: interruttori ---------- */
function syncToggles() {
  document.querySelectorAll('[data-t]').forEach(b => {
    const k = b.dataset.t, on = k === 'snd' ? Snd.sfx : Snd.music;
    b.setAttribute('aria-pressed', on);
    if (b.classList.contains('ib')) b.innerHTML = k === 'snd' ? (on ? IC.snd : IC.sndOff) : (on ? IC.mus : IC.musOff);
    else b.textContent = (k === 'snd' ? 'Suoni ' : 'Musica ') + (on ? 'attivi' : 'spenti');
  });
}
function setSfx(v) { Snd.sfx = v; save.sfx = v; persist(); syncToggles(); if (v) sfx.click(); }
function setMusic(v) { Snd.music = v; save.music = v; persist(); syncToggles(); Snd.unlock(); Music.sync(); }

/* ---------- azioni dei pulsanti ---------- */
const acts = {
  play() { openLevel(nextLv()); },
  levels() { closeModal(); gen++; showLevels(); },
  menu() { closeModal(); gen++; refreshMenu(); show('menu'); },
  help() { openHelp(); },
  close() { closeModal(); },
  pause() { openPause(); },
  begin() { closeModal(); beginLevel(); },
  resume() { closeModal(); resetHint(); },
  retry() { openLevel(lvIdx, true); },
  next() { closeModal(); openLevel(lvIdx + 1); },
  tsnd() { setSfx(!Snd.sfx); },
  tmus() { setMusic(!Snd.music); },
  lv(b) { const i = +b.dataset.i; if (!unlocked(i)) { sfx.bad(); return; } openLevel(i); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  Snd.unlock();
  if (b.dataset.act !== 'lv' && b.dataset.act !== 'tsnd') sfx.click();
  acts[b.dataset.act] && acts[b.dataset.act](b);
});
document.addEventListener('pointerdown', () => Snd.unlock(), { passive: true });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (!Snd.ctx) return;
  if (document.hidden) { Snd.ctx.suspend && Snd.ctx.suspend(); Music.sync(); }
  else { Snd.ctx.resume && Snd.ctx.resume(); Music.sync(); }
});

/* ---------- inizializzazione ---------- */
(function init() {
  const lg = $('#logo');
  const logoHTML = 'Dolcetti'.split('').map((ch, i) => `<span style="--i:${i};--lc:${COL[i % 6]}">${ch}</span>`).join('');
  lg.innerHTML = logoHTML; $('#logo2').innerHTML = logoHTML;
  setTimeout(() => { if ($('#boot').classList.contains('on')) { window.DolcettiApp.setAccount(null); show('menu'); } }, 8000);
  $('#showcase').innerHTML = [0, 1, 2, 3, 4, 5].map(t => `<i style="--rot:${(t % 2 ? 1 : -1) * (5 + t * 2)}deg">${candy(t, 0)}</i>`).join('');
  document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = IC[el.dataset.icon]; });
  for (let i = 0; i < N * N; i++) {
    const a = document.createElement('div'); a.className = ((i / N | 0) + i % N) % 2 ? 'b' : 'a'; bgEl.appendChild(a);
    iceEl.appendChild(document.createElement('div'));
  }
  syncToggles(); refreshMenu();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

/* ---------- ponte verso il login (usato dallo script Firebase) ---------- */
window.DolcettiApp = {
  GUEST_KEY,
  readLocal,
  show,
  // cambia salvataggio attivo (ospite o account) e aggiorna tutto
  useSave(key, data) {
    storeKey = key;
    save = Object.assign(blankSave(), data || {});
    if (!Array.isArray(save.stars)) save.stars = [];
    Snd.sfx = save.sfx !== false; Snd.music = save.music !== false;
    try { localStorage.setItem(storeKey, JSON.stringify(save)); } catch (e) {}
    syncToggles(); refreshMenu(); Music.sync();
  },
  getSave: () => save,
  setAccount(name, status) {
    $('#accName').textContent = name ? 'Giocatore: ' + name : 'Stai giocando come ospite';
    $('#accBtn').textContent = name ? 'Esci' : 'Accedi';
    $('#cloudSt').textContent = status || '';
  },
  setStatus(t) { $('#cloudSt').textContent = t || ''; }
};

window.DOLCETTI = { LEVELS, openLevel, beginLevel, attempt, getHint, analyze, comboFor, valid,
  get st() { return { board, iceG, moves, score, collected, iceLeft, busy, over, lvIdx }; } };
})();

<script type="module">
/* =====================================================================
   LOGIN E SALVATAGGIO NEL CLOUD (Firebase)
   Incolla qui sotto la configurazione che ti dà Firebase
   (Impostazioni progetto > Le tue app > app Web > firebaseConfig).
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBjdBE4K-D8vrwcTbOUa_m6yFwBJJ7rwtw",
  authDomain: "dolcetto-c2ba8.firebaseapp.com",
  projectId: "dolcetto-c2ba8",
  storageBucket: "dolcetto-c2ba8.firebasestorage.app",
  messagingSenderId: "3436905253",
  appId: "1:3436905253:web:d9d1af36b00f30bc95d0cc"
};

const App = window.DolcettiApp;
const $ = s => document.querySelector(s);
const FB = 'https://www.gstatic.com/firebasejs/10.14.1/';
const LAST_KEY = 'dolcetti_last';
const GUEST_FLAG = 'dolcetti_guest';
const NAME_RE = /^[A-Za-z0-9_]{3,16}$/;
const configured = !String(firebaseConfig.apiKey).startsWith('INCOLLA');
const keyFor = uid => 'dolcetti_v2_u_' + uid;
const emailOf = n => n.toLowerCase() + '@dolcetti.game';
const ERR = {
  'auth/email-already-in-use': 'Questo nome è già preso',
  'auth/invalid-credential': 'Nome o password sbagliati',
  'auth/user-not-found': 'Nome o password sbagliati',
  'auth/wrong-password': 'Nome o password sbagliati',
  'auth/invalid-email': 'Nome non valido',
  'auth/weak-password': 'Password troppo corta (minimo 6 caratteri)',
  'auth/network-request-failed': 'Niente connessione',
  'auth/too-many-requests': 'Troppi tentativi, riprova tra qualche minuto',
  'auth/operation-not-allowed': 'Login non attivo: attiva Email/Password su Firebase'
};

let fb = {}, auth = null, db = null, user = null, name = '', timer = null;

const stars = a => { const o = []; for (let i = 0; i < (a ? a.length : 0); i++) o.push(Math.min(3, Math.max(0, +a[i] || 0))); return o; };
function merge(local, cloud) {
  const n = Math.max((local.stars || []).length, (cloud.stars || []).length), st = [];
  for (let i = 0; i < n; i++) st.push(Math.max((local.stars || [])[i] || 0, (cloud.stars || [])[i] || 0));
  return { stars: st, sfx: cloud.sfx !== false, music: cloud.music !== false };
}
const setStatus = t => App.setStatus(t);
const msg = (t, ok) => { const m = $('#lgMsg'); m.textContent = t || ''; m.classList.toggle('ok', !!ok); };
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error('timeout')), ms))]);

/* ---------- guest / offline ---------- */
function goGuest() {
  localStorage.setItem(GUEST_FLAG, '1');
  user = null; name = '';
  App.useSave(App.GUEST_KEY, App.readLocal(App.GUEST_KEY));
  App.setAccount(null, configured ? '' : 'Login non ancora attivo');
  App.show('menu');
}
function offlineFallback() {
  let last = null; try { last = JSON.parse(localStorage.getItem(LAST_KEY)); } catch (e) {}
  if (last && last.uid) {
    user = null; name = last.name;
    App.useSave(keyFor(last.uid), App.readLocal(keyFor(last.uid)));
    App.setAccount(last.name, 'Offline: salvo sul telefono');
    App.show('menu');
  } else goGuest();
}

/* ---------- salvataggio cloud ---------- */
async function pushNow() {
  if (!user || !db) return;
  const s = App.getSave();
  setStatus('Salvo…');
  try {
    await withTimeout(fb.setDoc(fb.doc(db, 'players', user.uid), {
      name, stars: stars(s.stars), sfx: s.sfx !== false, music: s.music !== false, updatedAt: fb.serverTimestamp()
    }), 6000);
    setStatus('Salvato nel cloud');
  } catch (e) { setStatus('Offline: salvo sul telefono'); }
}
window.onDolcettiSave = () => { if (!user) return; clearTimeout(timer); timer = setTimeout(pushNow, 700); };
document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(timer); pushNow(); } });

async function enterAccount(u, seedGuest) {
  user = u; name = u.displayName || (u.email || '').split('@')[0];
  try { localStorage.setItem(LAST_KEY, JSON.stringify({ uid: u.uid, name })); localStorage.removeItem(GUEST_FLAG); } catch (e) {}

    App.useSave(keyFor(u.uid), merged);

  } catch (e) { setStatus('Offline: salvo sul telefono'); }
}

/* ---------- schermata di login ---------- */
async function submit(mode) {
  const n = $('#lgName').value.trim(), p = $('#lgPass').value;
  if (!configured) { msg('Login non ancora attivo: manca la configurazione Firebase'); return; }
  if (!NAME_RE.test(n)) { msg('Nome: da 3 a 16 caratteri, solo lettere, numeri e _'); return; }
  if (p.length < 6) { msg('La password deve avere almeno 6 caratteri'); return; }

  try {
    if (mode === 'reg') {
      const cred = await fb.createUserWithEmailAndPassword(auth, emailOf(n), p);
      try { await fb.updateProfile(cred.user, { displayName: n }); } catch (e) {}
      await enterAccount(cred.user, App.readLocal(App.GUEST_KEY));
    } else {
      const cred = await fb.signInWithEmailAndPassword(auth, emailOf(n), p);
      if (!cred.user.displayName) { try { await fb.updateProfile(cred.user, { displayName: n }); } catch (e) {} }
      await enterAccount(cred.user, null);
    }
    $('#lgPass').value = ''; msg('');
  } catch (e) {
    msg(ERR[e && e.code] || 'Qualcosa non ha funzionato, riprova');
  }

}
$('#lgIn').addEventListener('click', () => submit('in'));
$('#lgReg').addEventListener('click', () => submit('reg'));
$('#lgGuest').addEventListener('click', goGuest);

$('#accBtn').addEventListener('click', async () => {
  if (user) {
    clearTimeout(timer); await pushNow();
    try { await fb.signOut(auth); } catch (e) {}
    try { localStorage.removeItem(LAST_KEY); } catch (e) {}
    user = null; name = '';
    App.useSave(App.GUEST_KEY, App.readLocal(App.GUEST_KEY));
  }
  $('#lgPass').value = ''; msg('');
  App.show('login');
});

/* ---------- avvio ---------- */
(async function start() {
  if (!configured) { goGuest(); return; }
  try {
    const [appM, authM, fsM] = await Promise.all([
      import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js')

  let first = true;
  fb.onAuthStateChanged(auth, u => {
    if (!first) return; first = false;
    if (u) enterAccount(u, null);
    else if (localStorage.getItem(GUEST_FLAG)) goGuest();
    else App.show('login');
  });
})();
</script>
